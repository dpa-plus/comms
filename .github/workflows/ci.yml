name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Job names are the required-check names in branch protection. Do not rename.
    name: python (${{ matrix.os }}, py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  python-wheel:
    name: python wheel (clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # An editable install resolves comms_graph from its own directory, which
      # hides two failures this job exists to catch: a module missing from
      # [tool.setuptools] packages, and a console script that only works from
      # the directory it was built in. Both have happened here.
      - name: build wheel
        working-directory: python
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
      - name: install into a clean environment and run from elsewhere
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install python/dist/*.whl
          cd /
          /tmp/clean/bin/comms-graph version
          /tmp/clean/bin/comms version
          /tmp/clean/bin/python -m comms_graph.doctor --help
          /tmp/clean/bin/comms-graph doctor --help
          /tmp/clean/bin/comms-graph --version
          /tmp/clean/bin/comms-graph --help > /tmp/verbs.txt
          for v in claim release check board status task tasks next brief \
                   session doc find note log hello mcp ui version doctor hook guard whoami; do
            grep -qE "^  $v" /tmp/verbs.txt || { echo "wheel lost the '$v' verb"; exit 1; }
          done
