name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload artifacts

# Folge-Pushes warten auf den laufenden Lauf (Build/Deploy nie abbrechen).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release (wheel, sdist, install.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: tag matches __version__
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - name: build wheel and sdist
        working-directory: python
        run: |
          python -m pip install build
          python -m build --outdir dist .
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes python/dist/* install.sh
